[project]
name = "dodge-vla"
version = "0.1.0"
description = "A tiny vision-language-action model that plays a falling-blocks game"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.6",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
